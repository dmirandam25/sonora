<title>Sonora</title>

  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'] },
        colors: { accent: { DEFAULT: '#22c55e', hover: '#4ade80' }, panel: '#121212', elev: '#1f1f1f' }
      }
    }
  };

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="drive.js"></script>
<style>
  html, body { background: #000; }
  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border: 3px solid transparent; background-clip: padding-box; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.3); }
  ::-webkit-scrollbar-track { background: transparent; }

  input[type=range].rng { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 9999px; cursor: pointer; outline: none;
    background: linear-gradient(to right, var(--fill, #fff) var(--p, 0%), rgba(255,255,255,.3) var(--p, 0%)); }
  input[type=range].rng:hover, input[type=range].rng:focus-visible { --fill: #22c55e; }
  input[type=range].rng::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .15s; }
  input[type=range].rng::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; opacity: 0; }
  input[type=range].rng:hover::-webkit-slider-thumb, input[type=range].rng:active::-webkit-slider-thumb { opacity: 1; }
  input[type=range].rng:hover::-moz-range-thumb { opacity: 1; }
  @media (hover: none) {
    input[type=range].rng::-webkit-slider-thumb { opacity: 1; }
    input[type=range].rng::-moz-range-thumb { opacity: 1; }
  }

  .ctl { position: relative; color: #b3b3b3; transition: color .15s, transform .1s; }
  .ctl:hover { color: #fff; }
  .ctl:active { transform: scale(.94); }
  .ctl.on { color: #22c55e; }
  .ctl.on::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #22c55e; }
  .ctl .badge { display: none; }
  .ctl.one .badge { display: grid; }

  .is-playing .t-title, .is-playing .t-idx { color: #22c55e; }
  .eq { display: none; }
  .is-playing.playing-now .t-idx-num { display: none; }
  .is-playing.playing-now .eq { display: inline-flex; }
  .eq span { width: 3px; background: #22c55e; border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: -.4s; }
  .eq span:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 12px; } }

  .toast-in { animation: toastIn .25s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .sheet-in { animation: sheetIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body class="font-sans text-white antialiased h-[100dvh] overflow-hidden select-none">

<div class="h-full flex flex-col">
  <div class="flex-1 min-h-0 flex gap-2 p-0 md:p-2">

    <!-- Barra lateral -->
    <aside class="hidden md:flex w-[300px] shrink-0 flex-col gap-2">
      <nav class="bg-panel rounded-lg px-3 py-4 space-y-1">
        <div class="flex items-center gap-2 px-3 pb-3">
          <span class="w-8 h-8 rounded-full bg-accent grid place-items-center text-black" data-icon="logo"></span>
          <span class="text-xl font-extrabold tracking-tight">Sonora</span>
          <button data-act="cloud" data-bind="cloud-pill" title="Conectar a la nube" class="ml-auto w-8 h-8 rounded-full grid place-items-center text-zinc-400 hover:bg-white/10 transition"><span class="w-5 h-5" data-icon="cloud"></span></button>
        </div>
        <button data-act="nav" data-view="home" data-nav="home" class="nav-link w-full flex items-center gap-4 px-3 py-2 rounded-md font-bold text-zinc-400 hover:text-white transition">
          <span class="w-6 h-6" data-icon="home"></span>Inicio
        </button>
        <button data-act="nav" data-view="search" data-nav="search" class="nav-link w-full flex items-center gap-4 px-3 py-2 rounded-md font-bold text-zinc-400 hover:text-white transition">
          <span class="w-6 h-6" data-icon="search"></span>Buscar
        </button>
      </nav>

      <section class="bg-panel rounded-lg flex-1 min-h-0 flex flex-col">
        <div class="flex items-center justify-between px-4 pt-4 pb-2">
          <button data-act="nav" data-view="library" class="flex items-center gap-3 font-bold text-zinc-400 hover:text-white transition">
            <span class="w-6 h-6" data-icon="library"></span>Tu biblioteca
          </button>
          <button data-act="new-playlist" title="Crear playlist" class="w-8 h-8 rounded-full grid place-items-center text-zinc-400 hover:text-white hover:bg-white/10 transition">
            <span class="w-5 h-5" data-icon="plus"></span>
          </button>
        </div>
        <div class="flex gap-2 px-4 pb-3">
          <button data-act="upload" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-sm font-semibold transition">
            <span class="w-4 h-4" data-icon="upload"></span>Agregar música
          </button>
          <button data-act="add-url" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-sm font-semibold transition">
            <span class="w-4 h-4" data-icon="link"></span>Enlace
          </button>
          <button data-act="drive" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-sm font-semibold transition">
            <span class="w-4 h-4" data-icon="folder"></span>Drive
          </button>
        </div>
        <div id="sidebar-list" class="flex-1 min-h-0 overflow-y-auto px-2 pb-2"></div>
      </section>
    </aside>

    <!-- Contenido central -->
    <main id="main" class="flex-1 min-w-0 bg-panel md:rounded-lg overflow-y-auto overflow-x-hidden"></main>
  </div>

  <!-- Reproductor -->
  <footer class="shrink-0 bg-black">
    <!-- Escritorio -->
    <div class="hidden md:grid grid-cols-[minmax(180px,1fr)_minmax(320px,2fr)_minmax(180px,1fr)] items-center gap-4 h-[80px] px-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-14 h-14 rounded overflow-hidden shrink-0 bg-elev" data-bind="cover"></div>
        <div class="min-w-0">
          <div class="text-sm font-semibold truncate" data-bind="title">Nada sonando</div>
          <div class="text-xs text-zinc-400 truncate" data-bind="artist">Elige una canción</div>
        </div>
        <button data-act="like" data-bind="like" title="Me gusta" class="ctl w-8 h-8 shrink-0 grid place-items-center"><span class="w-5 h-5" data-icon="heart"></span></button>
      </div>

      <div class="flex flex-col items-center gap-1.5">
        <div class="flex items-center gap-5">
          <button data-act="shuffle" data-bind="shuffle" title="Aleatorio" class="ctl w-8 h-8 grid place-items-center"><span class="w-5 h-5" data-icon="shuffle"></span></button>
          <button data-act="prev" title="Anterior" class="ctl w-8 h-8 grid place-items-center"><span class="w-6 h-6" data-icon="prev"></span></button>
          <button data-act="toggle" title="Reproducir / Pausar (Espacio)" class="w-9 h-9 rounded-full bg-white text-black grid place-items-center hover:scale-105 active:scale-95 transition"><span class="w-6 h-6" data-bind="play-icon"></span></button>
          <button data-act="next" title="Siguiente" class="ctl w-8 h-8 grid place-items-center"><span class="w-6 h-6" data-icon="next"></span></button>
          <button data-act="repeat" data-bind="repeat" title="Repetir" class="ctl w-8 h-8 grid place-items-center">
            <span class="w-5 h-5" data-icon="repeat"></span>
            <span class="badge absolute top-0.5 right-0 w-3 h-3 rounded-full bg-accent text-black text-[8px] font-black place-items-center">1</span>
          </button>
        </div>
        <div class="w-full flex items-center gap-2 text-[11px] text-zinc-400 tabular-nums">
          <span class="w-10 text-right" data-bind="time">0:00</span>
          <input type="range" class="rng flex-1" min="0" max="1000" value="0" step="1" data-bind="seek" aria-label="Progreso">
          <span class="w-10" data-bind="duration">0:00</span>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <button data-act="mute" data-bind="mute" title="Silenciar" class="ctl w-8 h-8 grid place-items-center"><span class="w-5 h-5" data-icon="volume"></span></button>
        <input type="range" class="rng w-28" min="0" max="100" value="80" data-bind="volume" aria-label="Volumen">
      </div>
    </div>

    <!-- Celular: mini reproductor -->
    <div class="md:hidden px-2 pt-1">
      <div id="mini" class="relative rounded-md overflow-hidden bg-elev transition-colors">
        <div class="flex items-center gap-3 p-2">
          <div data-act="open-now" class="flex items-center gap-3 flex-1 min-w-0">
            <div class="w-10 h-10 rounded overflow-hidden shrink-0 bg-black/30" data-bind="cover"></div>
            <div class="min-w-0">
              <div class="text-sm font-semibold truncate" data-bind="title">Nada sonando</div>
              <div class="text-xs text-zinc-300 truncate" data-bind="artist">Elige una canción</div>
            </div>
          </div>
          <button data-act="like" data-bind="like" class="ctl w-9 h-9 grid place-items-center"><span class="w-6 h-6" data-icon="heart"></span></button>
          <button data-act="toggle" class="w-9 h-9 grid place-items-center text-white"><span class="w-7 h-7" data-bind="play-icon"></span></button>
        </div>
        <div class="absolute left-2 right-2 bottom-0 h-[2px] bg-white/20 rounded-full overflow-hidden">
          <div class="h-full bg-white" style="width:0%" data-bind="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Celular: navegación -->
    <nav class="md:hidden grid grid-cols-3 pt-2 pb-[max(8px,env(safe-area-inset-bottom))] bg-gradient-to-t from-black via-black to-black/80">
      <button data-act="nav" data-view="home" data-nav="home" class="nav-link flex flex-col items-center gap-1 text-[11px] text-zinc-400"><span class="w-6 h-6" data-icon="home"></span>Inicio</button>
      <button data-act="nav" data-view="search" data-nav="search" class="nav-link flex flex-col items-center gap-1 text-[11px] text-zinc-400"><span class="w-6 h-6" data-icon="search"></span>Buscar</button>
      <button data-act="nav" data-view="library" data-nav="library" class="nav-link flex flex-col items-center gap-1 text-[11px] text-zinc-400"><span class="w-6 h-6" data-icon="library"></span>Tu biblioteca</button>
    </nav>
  </footer>
</div>

<!-- Celular: pantalla "Reproduciendo" -->
<div id="now" class="md:hidden fixed inset-0 z-40 hidden flex-col px-6 pt-[max(16px,env(safe-area-inset-top))] pb-[max(28px,env(safe-area-inset-bottom))]">
  <div class="flex items-center justify-between">
    <button data-act="close-now" class="w-10 h-10 -ml-2 grid place-items-center"><span class="w-8 h-8" data-icon="chevronDown"></span></button>
    <div class="text-xs font-bold uppercase tracking-widest text-zinc-300">Reproduciendo</div>
    <div class="w-10"></div>
  </div>
  <div class="flex-1 min-h-0 grid place-items-center py-6">
    <div class="w-full max-w-[min(100%,52vh)] aspect-square rounded-lg overflow-hidden shadow-2xl shadow-black/60 bg-black/30" data-bind="cover"></div>
  </div>
  <div class="flex items-center gap-3">
    <div class="flex-1 min-w-0">
      <div class="text-2xl font-bold truncate" data-bind="title">Nada sonando</div>
      <div class="text-zinc-300 truncate" data-bind="artist">Elige una canción</div>
    </div>
    <button data-act="like" data-bind="like" class="ctl w-10 h-10 grid place-items-center"><span class="w-7 h-7" data-icon="heart"></span></button>
  </div>
  <div class="mt-5">
    <input type="range" class="rng" min="0" max="1000" value="0" step="1" data-bind="seek" aria-label="Progreso">
    <div class="flex justify-between text-xs text-zinc-300 tabular-nums mt-1.5">
      <span data-bind="time">0:00</span><span data-bind="duration">0:00</span>
    </div>
  </div>
  <div class="flex items-center justify-between mt-4">
    <button data-act="shuffle" data-bind="shuffle" class="ctl w-10 h-10 grid place-items-center"><span class="w-6 h-6" data-icon="shuffle"></span></button>
    <button data-act="prev" class="ctl !text-white w-12 h-12 grid place-items-center"><span class="w-9 h-9" data-icon="prev"></span></button>
    <button data-act="toggle" class="w-16 h-16 rounded-full bg-white text-black grid place-items-center active:scale-95 transition"><span class="w-9 h-9" data-bind="play-icon"></span></button>
    <button data-act="next" class="ctl !text-white w-12 h-12 grid place-items-center"><span class="w-9 h-9" data-icon="next"></span></button>
    <button data-act="repeat" data-bind="repeat" class="ctl w-10 h-10 grid place-items-center">
      <span class="w-6 h-6" data-icon="repeat"></span>
      <span class="badge absolute top-0.5 right-0 w-3.5 h-3.5 rounded-full bg-accent text-black text-[9px] font-black place-items-center">1</span>
    </button>
  </div>
</div>

<!-- Arrastrar y soltar -->
<div id="drop" class="fixed inset-0 z-50 hidden place-items-center bg-black/80 backdrop-blur-sm pointer-events-none">
  <div class="border-2 border-dashed border-accent rounded-2xl px-12 py-10 text-center">
    <div class="w-14 h-14 mx-auto text-accent" data-icon="upload"></div>
    <div class="text-2xl font-bold mt-3">Suelta tu música aquí</div>
    <div class="text-zinc-400 mt-1">MP3, M4A, WAV, OGG, FLAC…</div>
  </div>
</div>

<input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.webm" multiple hidden>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-[150px] md:bottom-[100px] z-[60] hidden px-4 py-2.5 rounded-lg bg-white text-black text-sm font-semibold shadow-2xl max-w-[90vw] text-center"></div>

const DB = {

  open() {

      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of ['tracks', 'playlists', 'offline', 'drivemeta']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(store) {
    if (!this.db) return Promise.resolve([]);
    return new Promise((res, rej) => { const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  put(store, val) {
    if (!this.db) return Promise.resolve();
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).put(val); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  del(store, id) {
    if (!this.db) return Promise.resolve();
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  }
};

const cloud = {

  const all = [...state.tracks.values()].sort((a, b) => a.addedAt - b.addedAt);
  if (key === 'all') return all;
  if (key === 'liked') return all.filter(t => t.liked);

  if (key === 'recent') return all.slice().reverse().slice(0, 10);

    return all.filter(t => [t.title, t.artist, t.album].some(v => (v || '').toLowerCase().includes(q)));
  }

/* ---------- Render ---------- */
function renderSidebar() { $('#sidebar-list').innerHTML = libraryKeys().map(k => libraryItem(k, true)).join(''); }
function renderNav() {
  $$('.nav-link').forEach(el => {
    const on = el.dataset.nav === state.view.name;
    el.classList.toggle('text-white', on); el.classList.toggle('text-zinc-400', !on);
  });
}
function renderMain() {
  const v = state.view;
  if (v.name === 'search' && $('#search-input')) { renderSearchResults(); return; }
  const main = $('#main');
  main.innerHTML = v.name === 'search' ? viewSearch() : v.name === 'library' ? viewLibrary() : v.name === 'playlist' ? viewPlaylist(v.key) : viewHome();
  if (v.name === 'search') {
    const inp = $('#search-input');
    inp.addEventListener('input', () => { state.search = inp.value; renderSearchResults(); });
    renderSearchResults();
  }
  refreshMarks();
}
function renderAll() { renderSidebar(); renderNav(); renderMain(); }
function navigate(view, key, push = true) {
  if (view === 'playlist' && !listMeta(key)) view = 'home';
  const same = state.view.name === view && state.view.key === key;
  if (push && !same) history.pushState({ app: 'sonora', view, key }, '');
  state.view = { name: view, key };
  $('#main').innerHTML = '';
  renderAll();
  $('#main').scrollTop = 0;
  if (view === 'search') $('#search-input')?.focus({ preventScroll: true });
}

function refreshMarks() {
  const t = current(); const playing = !audio.paused;
  $$('[data-row]').forEach(el => {
    const on = !!t && el.dataset.row === t.id;
    el.classList.toggle('is-playing', on);
    el.classList.toggle('playing-now', on && playing);
  });
  $$('[data-list-play]').forEach(el => {
    const ic = el.querySelector('.list-play-icon');
    if (ic) ic.innerHTML = icon(state.source === el.dataset.listPlay && playing ? 'pause' : 'play');
  });
}

/* ---------- Reproductor ---------- */
function updateNowPlaying() {
  const t = current();
  $$('[data-bind=title]').forEach(el => el.textContent = t ? t.title : 'Nada sonando');
  $$('[data-bind=artist]').forEach(el => el.textContent = t ? t.artist : 'Elige una canción');
  $$('[data-bind=cover]').forEach(el => el.innerHTML = coverHTML(t, 'w-1/2 h-1/2'));
  updateLikeButtons();
  const h = t ? hueOf(t) : 0;
  $('#mini').style.background = t ? `hsl(${h} 35% 22%)` : '';
  $('#now').style.background = t ? `linear-gradient(to bottom,hsl(${h} 45% 30%),#121212 85%)` : '#121212';
  document.title = t ? `${t.title} · ${t.artist}` : 'Sonora';
  updateTime();
  if ('mediaSession' in navigator && t) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, album: t.album || '',
        artwork: t.coverUrl ? [{ src: t.coverUrl, sizes: '512x512' }] : []
      });
    } catch {}
  }
}
function updateLikeButtons() {
  const t = current();
  $$('[data-bind=like]').forEach(el => {
    el.dataset.id = t ? t.id : '';
    el.classList.toggle('!text-accent', !!t?.liked);
    el.firstElementChild.innerHTML = icon(t?.liked ? 'heartFill' : 'heart');
    el.style.visibility = t ? 'visible' : 'hidden';
  });
}
function updatePlayIcons() {
  $$('[data-bind=play-icon]').forEach(el => el.innerHTML = icon(audio.paused ? 'play' : 'pause'));
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
}
function updateModes() {
  $$('[data-bind=shuffle]').forEach(el => el.classList.toggle('on', state.shuffle));
  $$('[data-bind=repeat]').forEach(el => { el.classList.toggle('on', state.repeat !== 'off'); el.classList.toggle('one', state.repeat === 'one'); });
}
function updateVolumeUI() {
  const v = audio.muted ? 0 : audio.volume;
  $$('[data-bind=volume]').forEach(el => { el.value = Math.round(v * 100); el.style.setProperty('--p', v * 100 + '%'); });
  $$('[data-bind=mute]').forEach(el => el.firstElementChild.innerHTML = icon(v === 0 ? 'mute' : v < 0.5 ? 'volumeLow' : 'volume'));
}
function updateTime() {
  const d = audio.duration, c = audio.currentTime;
  const t = current();
  const dur = isFinite(d) ? d : (t?.duration ?? NaN);
  const pct = isFinite(dur) && dur > 0 ? Math.min(100, (c / dur) * 100) : 0;
  if (!seeking) {
    $$('[data-bind=seek]').forEach(el => { el.value = pct * 10; el.style.setProperty('--p', pct + '%'); });
    $$('[data-bind=time]').forEach(el => el.textContent = fmt(t ? c : 0));
  }
  $$('[data-bind=duration]').forEach(el => el.textContent = t ? fmt(dur) : '0:00');
  $$('[data-bind=progress-bar]').forEach(el => el.style.width = pct + '%');
}

function loadIndex(i, autoplay = true) {
  const t = state.tracks.get(state.queue[i]);
  if (!t) return;
  state.qi = i;
  // Canción de Drive aún no bajada: se baja primero y luego suena.
  if (t.kind === 'gdrive' && !t.url) {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    updateNowPlaying(); updatePlayIcons(); refreshMarks(); renderSidebar();
    const slow = setTimeout(() => current()?.id === t.id && toast(`Cargando “${t.title}” desde Drive…`), 700);
    drive.resolve(t).then(url => {
      if (current()?.id !== t.id) return;
      audio.src = url;
      if (autoplay) audio.play().catch(e => { if (e.name !== 'AbortError') console.warn(e); });
    }).catch(e => {
      if (current()?.id === t.id) toast(e.message || 'No se pudo cargar la canción de Drive');
    }).finally(() => clearTimeout(slow));
    return;
  }
  audio.src = t.url;
  if (autoplay) audio.play().catch(e => { if (e.name !== 'AbortError') console.warn(e); });
  updateNowPlaying(); refreshMarks(); renderSidebar();
}
function playQueue(ids, start, key) {
  if (!ids.length) return toast('Esta lista está vacía');
  state.source = key; state.origQueue = ids.slice(); errorStreak = 0;
  if (state.shuffle) {
    const first = ids[start];
    state.queue = [first, ...shuffleArr(ids.filter((_, i) => i !== start))];
    loadIndex(0);
  } else {
    state.queue = ids.slice();
    loadIndex(start);
  }
}
function playKey(key) {
  if (state.source === key && current()) return togglePlay();
  const ids = listTracks(key).map(t => t.id);
  if (!ids.length) return toast('Esta lista está vacía');
  playQueue(ids, state.shuffle ? Math.floor(Math.random() * ids.length) : 0, key);
}
function togglePlay() {
  if (!current()) return playKey(listTracks('all').length ? 'all' : 'liked');
  if (!audio.src) return loadIndex(state.qi); // p. ej. una canción de Drive que no se pudo bajar
  if (audio.paused) audio.play().catch(() => toast('No se pudo reproducir esta canción')); else audio.pause();
}
function next(auto = false) {
  if (!state.queue.length) return;
  let i = state.qi + 1;
  if (i >= state.queue.length) {
    if (state.repeat === 'all' || !auto) i = 0;
    else { audio.pause(); audio.currentTime = 0; return; }
  }
  loadIndex(i);
}
function prev() {
  if (!state.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let i = state.qi - 1;
  if (i < 0) i = state.repeat === 'all' ? state.queue.length - 1 : 0;
  loadIndex(i);
}
function toggleShuffle() {
  state.shuffle = !state.shuffle; ls.set('sonora-shuffle', state.shuffle);
  const cur = state.queue[state.qi];
  if (cur) {
    if (state.shuffle) {
      state.origQueue = state.queue.slice();
      state.queue = [cur, ...shuffleArr(state.queue.filter(id => id !== cur))];
      state.qi = 0;
    } else {
      state.queue = state.origQueue.filter(id => state.tracks.has(id));
      state.qi = Math.max(0, state.queue.indexOf(cur));
    }
  }
  updateModes();
  toast(state.shuffle ? 'Aleatorio activado' : 'Aleatorio desactivado');
}
function cycleRepeat() {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  ls.set('sonora-repeat', state.repeat); updateModes();
  toast({ off: 'Repetir desactivado', all: 'Repetir lista', one: 'Repetir canción' }[state.repeat]);
}
function toggleMute() {
  if (audio.muted || audio.volume === 0) { audio.muted = false; audio.volume = lastVolume || 0.8; }
  else { audio.muted = true; }
  updateVolumeUI();
}
function playNext(id) {
  if (!current()) { state.source = null; state.queue = [id]; state.origQueue = [id]; loadIndex(0); return; }
  state.queue.splice(state.qi + 1, 0, id);
  state.origQueue.push(id);
  toast('Se reproducirá a continuación');
}

    t.duration = audio.duration; saveTrack(t).catch(() => {});
    $$(`[data-dur="${t.id}"]`).forEach(el => el.textContent = fmt(t.duration));
  }

audio.addEventListener('ended', () => {

if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch {} };
  set('play', () => audio.play()); set('pause', () => audio.pause());
  set('previoustrack', prev); set('nexttrack', () => next());
  set('seekto', d => { audio.currentTime = d.seekTime; });
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set('seekforward', d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
}

/* ---------- Biblioteca: agregar / editar ---------- */
const AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm|weba)$/i;
const isAudio = f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name);
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  const m = base.match(/^(.+?)\s+[-–]\s+(.+)$/);
  return m ? { artist: m[1].replace(/^\d+[\s.-]+/, ''), title: m[2] } : { artist: '', title: base.replace(/^\d+[\s.-]+/, '') || base };
}
function readTags(file) {
  return new Promise(res => {
    if (!window.jsmediatags) return res({});
    const timer = setTimeout(() => res({}), 6000);
    try {
      window.jsmediatags.read(file, {
        onSuccess: ({ tags }) => {
          clearTimeout(timer);
          let coverBlob = null;
          if (tags.picture?.data?.length) coverBlob = new Blob([new Uint8Array(tags.picture.data)], { type: tags.picture.format || 'image/jpeg' });
          res({ title: tags.title, artist: tags.artist, album: tags.album, coverBlob });
        },
        onError: () => { clearTimeout(timer); res({}); }
      });
    } catch { clearTimeout(timer); res({}); }
  });
}
function probeDuration(url) {
  return new Promise(res => {
    const a = new Audio(); let done = false;
    const finish = d => { if (done) return; done = true; res(d); a.removeAttribute('src'); a.load(); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => finish(a.duration);
    a.onerror = () => finish(NaN);
    setTimeout(() => finish(NaN), 10000);
    a.src = url;
  });
}
async function handleFiles(fileList, target) {
  const files = [...fileList].filter(isAudio);
  if (!files.length) return toast('No encontré archivos de audio');
  toast(`Agregando ${countLabel(files.length)}…`);
  const base = Date.now(); const ids = []; let saveFailed = false, failed = 0;
  for (const [i, f] of files.entries()) {
    const tags = await readTags(f);
    const p = parseName(f.name);
    const tmp = URL.createObjectURL(f);
    const meta = {
      title: (tags.title || p.title || 'Sin título').trim(),
      artist: (tags.artist || p.artist || 'Artista desconocido').trim(),
      album: (tags.album || '').trim(),
      coverBlob: tags.coverBlob || null, liked: false, addedAt: base + i,
      duration: await probeDuration(tmp),
    };
    URL.revokeObjectURL(tmp);
    let rec;
    if (cloud.active) {
      if (f.size > CLOUD_MAX_BYTES) { failed++; toast(`“${meta.title}” pesa más de 50 MB y no se puede subir`); continue; }
      toast(`Subiendo a la nube ${i + 1} de ${files.length}…`);
      try { rec = await cloud.addFile(f, meta); } catch (e) { console.warn(e); failed++; continue; }
    } else {
      rec = hydrate({ id: uid(), kind: 'file', blob: f, ...meta });
      await saveTrack(rec).catch(() => { saveFailed = true; });
    }
    state.tracks.set(rec.id, rec); ids.push(rec.id);
  }
  if (target?.startsWith('pl:') && ids.length) { const p = getPl(target.slice(3)); if (p) { p.trackIds.push(...ids); savePl(p); } }
  renderAll();
  if (failed) toast(`Listo: ${ids.length} de ${files.length} agregadas (${failed} no se pudieron subir)`);
  else toast(saveFailed ? 'Agregadas, pero no hay espacio para guardarlas al cerrar' : `${countLabel(ids.length)} ${ids.length === 1 ? 'agregada' : 'agregadas'}`);
}
async function addUrl(target) {
  const v = await modal({
    title: 'Agregar desde enlace', submit: 'Agregar',
    fields: [
      { name: 'url', label: 'URL del archivo de audio', placeholder: 'https://…/cancion.mp3', type: 'url', required: true },
      { name: 'title', label: 'Título', placeholder: 'Opcional' },
      { name: 'artist', label: 'Artista', placeholder: 'Opcional' },
    ]
  });
  if (!v) return;
  const url = v.url.trim();
  if (!/^https?:\/\//i.test(url)) return toast('El enlace debe empezar con http:// o https://');
  const p = parseName(decodeURIComponent(url.split(/[?#]/)[0].split('/').pop() || 'Canción'));
  const rec = hydrate({ id: uid(), kind: 'url', src: url, title: v.title.trim() || p.title, artist: v.artist.trim() || p.artist || 'Desde enlace', album: '', coverBlob: null, liked: false, addedAt: Date.now(), duration: NaN });
  state.tracks.set(rec.id, rec);
  await saveTrack(rec).catch(() => {});
  if (target?.startsWith('pl:')) { const pl = getPl(target.slice(3)); if (pl) { pl.trackIds.push(rec.id); savePl(pl); } }
  renderAll();
  toast('Canción agregada');
  probeDuration(url).then(d => {
    if (!isFinite(d)) return toast('Ojo: ese enlace no parece un archivo de audio reproducible');
    rec.duration = d; saveTrack(rec).catch(() => {});
    $$(`[data-dur="${rec.id}"]`).forEach(el => el.textContent = fmt(d));
  });
}
function toggleLike(id) {

}

async function deletePlaylist(id) {

  state.playlists = state.playlists.filter(x => x.id !== id);

  if (state.source === 'pl:' + id) state.source = null;
  navigate('home'); toast('Playlist eliminada');
}
function addToPlaylist(plId, ids) {
  const p = getPl(plId); if (!p) return;
  const fresh = ids.filter(id => !p.trackIds.includes(id));
  if (!fresh.length) return toast(`Ya está en ${p.name}`);
  p.trackIds.push(...fresh); savePl(p);
  toast(`Agregada a ${p.name}`); renderSidebar(); renderMain();
}
function removeFromPlaylist(plId, id) {

  p.trackIds = p.trackIds.filter(x => x !== id); savePl(p);
  toast(`Quitada de ${p.name}`); renderSidebar(); renderMain();

async function deleteTrack(id) {
  const t = state.tracks.get(id); if (!t) return;
  if (!confirm(`¿Eliminar “${t.title}” de tu biblioteca?`)) return;
  const curId = current()?.id;
  if (curId === id) { audio.pause(); audio.removeAttribute('src'); audio.load(); }
  state.tracks.delete(id);
  if (t.kind === 'file') URL.revokeObjectURL(t.url);
  if (t.coverUrl) URL.revokeObjectURL(t.coverUrl);
  for (const p of state.playlists) if (p.trackIds.includes(id)) { p.trackIds = p.trackIds.filter(x => x !== id); savePl(p); }
  state.queue = state.queue.filter(x => x !== id);
  state.origQueue = state.origQueue.filter(x => x !== id);
  state.qi = curId === id ? -1 : state.queue.indexOf(curId);
  await removeTrackRecord(t).catch(e => { console.warn(e); toast('No se pudo eliminar en la nube'); });
  DB.del('offline', id).catch(() => {});
  updateNowPlaying(); updatePlayIcons(); renderAll();
  toast('Canción eliminada');
}

/* ---------- Botón «atrás» ---------- */
// Cada pantalla es una entrada del historial y cada ventana abierta (menú, diálogo,
// «Reproduciendo») también, así «atrás» la cierra o vuelve a la pantalla anterior.
// Debajo de todo hay una entrada «guardia» para que «atrás» en Inicio no cierre la app.
const hist = {
  stack: [],
  openOverlay(close) {
    this.stack.push(close);
    history.pushState({ app: 'sonora', view: state.view.name, key: state.view.key, overlay: true }, '');
  },
  // La ventana se cerró desde la app (no con «atrás»): su entrada pasa a ser la de la pantalla.
  closeOverlay(close) {
    const i = this.stack.lastIndexOf(close);
    if (i < 0) return;
    this.stack.splice(i, 1);
    if (history.state?.overlay) history.replaceState({ app: 'sonora', view: state.view.name, key: state.view.key }, '');
  },
};
window.addEventListener('popstate', e => {
  if (hist.stack.length) { hist.stack.pop()(); return; }
  const s = e.state;
  if (!s || s.app !== 'sonora' || s.guard) {
    if (state.view.name !== 'home') navigate('home', undefined, false);
    else toast('Pulsa atrás otra vez para salir');
    return;
  }
  // Entrada repetida de la misma pantalla: seguir retrocediendo.
  if (s.view === state.view.name && s.key === state.view.key) { history.back(); return; }
  navigate(s.view, s.key, false);
});
// Los navegadores ignoran entradas creadas sin interacción, así que la de Inicio
// sobre la guardia se vuelve a poner con el siguiente toque o tecla.
const armHistory = () => {
  if (history.state?.guard) history.pushState({ app: 'sonora', view: state.view.name, key: state.view.key }, '');
};
document.addEventListener('pointerdown', armHistory, true);
document.addEventListener('keydown', armHistory, true);

/* ---------- Descargas sin conexión ---------- */
// Se pueden descargar las canciones de tu nube (Supabase) y las de Google Drive.
const downloadable = t => !!t && ((cloud.active && t.kind === 'cloud') || t.kind === 'gdrive');
function downloadButton(key, tracks) {
  const dl = tracks.filter(downloadable);
  if (!dl.length) return '';
  const all = dl.every(t => t.offline);
  return `<button data-act="${all ? 'undownload-list' : 'download-list'}" data-list="${key}"
    title="${all ? 'Descargada · tocar para quitar la descarga' : 'Descargar para escuchar sin conexión'}"
    class="ctl ${all ? '!text-accent' : ''} w-10 h-10 grid place-items-center">${icon(all ? 'downloaded' : 'download', 'w-7 h-7')}</button>`;
}
async function downloadTracks(ids) {
  const todo = ids.map(id => state.tracks.get(id)).filter(t => downloadable(t) && !t.offline);
  if (!todo.length) return toast('Ya está todo descargado');
  if (!navigator.onLine || (cloud.offline && todo.some(t => t.kind === 'cloud'))) return toast('Necesitas internet para descargar');
  // Para Drive, pedir la sesión ahora (dentro del toque) por si hay que abrir la ventana de Google.
  if (todo.some(t => t.kind === 'gdrive')) {
    try { await drive.getToken(true); } catch (e) { return toast(e.message); }
  }
  let done = 0, failed = 0;
  for (const [i, t] of todo.entries()) {
    toast(`Descargando ${i + 1} de ${todo.length}…`);
    try {
      let blob, coverBlob = null;
      if (t.kind === 'gdrive') {
        blob = await drive.blob(t);
        coverBlob = t.coverUrl ? await fetch(t.coverUrl).then(r => r.blob()).catch(() => null) : null;
      } else {
        const res = await fetch(t.url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        blob = await res.blob();
        coverBlob = t.coverUrl ? await fetch(t.coverUrl).then(r => r.ok ? r.blob() : null).catch(() => null) : null;
      }
      await DB.put('offline', { id: t.id, userId: t.kind === 'gdrive' ? 'gdrive' : cloud.user.id, blob, coverBlob });
      if (t.url?.startsWith('blob:') && current()?.id !== t.id) URL.revokeObjectURL(t.url);
      t.url = URL.createObjectURL(blob);
      if (coverBlob) t.coverUrl = URL.createObjectURL(coverBlob);
      t.offline = true; done++;
    } catch (e) { console.warn(e); failed++; }
  }
  renderAll();
  toast(failed ? `Descargadas ${done}; ${failed} no se pudieron descargar` : `${countLabel(done)} ${done === 1 ? 'disponible' : 'disponibles'} sin conexión`);
}
async function removeDownloads(ids) {
  const sel = ids.map(id => state.tracks.get(id)).filter(t => t?.offline);
  if (!sel.length) return;
  for (const t of sel) { await DB.del('offline', t.id).catch(() => {}); t.offline = false; }
  // Drive: se vuelve a bajar cuando se reproduzca (la que suena sigue en memoria).
  for (const t of sel.filter(t => t.kind === 'gdrive')) {
    if (current()?.id === t.id) drive.remember(t);
    else { if (t.url?.startsWith('blob:')) URL.revokeObjectURL(t.url); t.url = null; }
  }
  const cloudSel = sel.filter(t => t.kind === 'cloud');
  if (cloudSel.length && cloud.active && !cloud.offline) {
    const signed = await cloud.sign(cloudSel.flatMap(t => [t.storagePath, t.coverPath]).filter(Boolean)).catch(() => ({}));
    for (const t of cloudSel) {
      if (t.url?.startsWith('blob:') && current()?.id !== t.id) URL.revokeObjectURL(t.url);
      t.url = signed[t.storagePath] || t.url;
      if (t.coverPath) t.coverUrl = signed[t.coverPath] || t.coverUrl;
    }
  }
  renderAll();
  toast(sel.length === 1 ? 'Descarga eliminada' : `${sel.length} descargas eliminadas`);
}

    <div class="flex items-center gap-3 p-3 rounded-lg bg-white/5">
      <span class="w-10 h-10 shrink-0 rounded-full bg-accent text-black grid place-items-center">${icon('cloud', 'w-5 h-5')}</span>
      <div class="min-w-0"><div class="font-semibold truncate">${esc(cloud.user.email)}</div>
        <div class="text-sm text-zinc-400">${countLabel(state.tracks.size)} · ${state.playlists.length} playlists en la nube</div></div>
    </div>
    <button type="button" data-c="migrate" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 text-left">
      <span class="w-5 h-5 shrink-0">${icon('upload')}</span>
      <span><span class="block font-semibold">Subir mi biblioteca local</span><span class="block text-sm text-zinc-400">Copia a la nube la música y las playlists guardadas en este dispositivo</span></span>
    </button>
    <div class="flex items-center justify-between pt-1">
      <button type="button" data-c="logout" class="text-sm text-zinc-400 hover:text-white">Cerrar sesión</button>
      <button type="button" data-c="close" class="${primary}">Listo</button>
    </div>`;

  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-[55] bg-black/70 grid place-items-center p-4';
  wrap.innerHTML = `<form class="w-full max-w-sm bg-[#282828] rounded-xl p-6 shadow-2xl space-y-4">
    <h2 class="text-xl font-bold flex items-center gap-2"><span class="w-6 h-6 text-accent">${icon('cloud')}</span>Nube</h2>${body}</form>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form');
  const dismiss = () => wrap.remove();
  const close = () => { wrap.remove(); hist.closeOverlay(dismiss); };
  hist.openOverlay(dismiss);
  const showErr = msg => { const el = form.querySelector('[data-c=err]'); el.textContent = msg; el.classList.remove('hidden'); };
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  form.addEventListener('click', async e => {
    const c = e.target.closest('[data-c]')?.dataset.c;
    if (c === 'close') close();
    else if (c === 'reset') { cloud.reset(); close(); openCloudPanel(); }
    else if (c === 'migrate') { close(); uploadLocalLibrary(); }
    else if (c === 'logout') {
      if (!confirm('¿Cerrar sesión? Volverás a tu biblioteca local de este dispositivo.')) return;
      close(); await cloud.signOut(); await loadLibrary(); toast('Sesión cerrada');
    }
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form));
    const btn = form.querySelector('button:not([type=button])');
    btn.disabled = true;
    try {
      if (!cfg) {
        const url = v.url.trim().replace(/\/+$/, '');
        if (!/^https:\/\/[^/]+$/.test(url)) throw new Error('La URL debe tener la forma https://xxxx.supabase.co');
        ls.set('sonora-cloud', { url, anonKey: v.anonKey.trim() });
        if (!cloud.init()) throw new Error('No se pudo conectar con esos datos');
        close(); openCloudPanel();
      } else {
        await cloud.signIn(v.email.trim(), v.password);
        close(); await loadLibrary(); toast('Conectado a la nube');
      }
    } catch (err) {
      btn.disabled = false;
      showErr(/invalid login/i.test(err.message) ? 'Correo o contraseña incorrectos' : err.message || 'Algo salió mal');
    }
  });
  form.querySelector('input')?.focus();
}

// Copia a la nube lo guardado en este dispositivo. Recuerda lo ya subido para no duplicarlo.
async function uploadLocalLibrary() {
  if (!cloud.active) return;
  const [tracks, pls] = await Promise.all([DB.all('tracks').catch(() => []), DB.all('playlists').catch(() => [])]);
  const map = ls.get('sonora-migrated', {});
  const todo = tracks
    .filter(r => !map[r.id] && !(r.kind === 'url' && /soundhelix\.com/.test(r.src)))
    .sort((a, b) => a.addedAt - b.addedAt);
  if (!todo.length && pls.every(p => map['pl:' + p.id])) return toast('No hay nada nuevo para subir');
  let done = 0, failed = 0;
  for (const [i, r] of todo.entries()) {
    toast(`Subiendo a la nube ${i + 1} de ${todo.length}…`);
    const meta = { title: r.title, artist: r.artist, album: r.album, coverBlob: r.coverBlob, duration: r.duration, liked: r.liked, addedAt: r.addedAt };
    try {
      let t;
      if (r.kind === 'file') {
        if (r.blob.size > CLOUD_MAX_BYTES) throw new Error('Archivo de más de 50 MB');
        t = await cloud.addFile(r.blob, meta);
      } else {
        t = { id: uid(), kind: 'url', src: r.src, url: r.src, coverUrl: null, ...meta, coverBlob: undefined };
        await cloud.saveTrack(t);
      }
      state.tracks.set(t.id, t);
      map[r.id] = t.id; ls.set('sonora-migrated', map); done++;
    } catch (e) { console.warn(e); failed++; }
  }
  for (const p of pls) {
    if (map['pl:' + p.id]) continue;
    const trackIds = p.trackIds.map(id => map[id]).filter(Boolean);
    if (!trackIds.length) continue;
    const np = { id: uid(), name: p.name, trackIds, createdAt: p.createdAt };
    try { await cloud.savePl(np); state.playlists.push(np); map['pl:' + p.id] = np.id; ls.set('sonora-migrated', map); }
    catch (e) { console.warn(e); failed++; }
  }
  renderAll();
  toast(failed ? `Subidas ${done} canciones; ${failed} elementos fallaron` : `Listo: ${countLabel(done)} subidas a la nube`);
}

/* ---------- Eventos ---------- */
const actions = {
  nav: el => navigate(el.dataset.view, el.dataset.key),
  'play-list': el => playKey(el.dataset.list),
  'play-track': el => { const key = el.dataset.list; playQueue(listTracks(key).map(t => t.id), +el.dataset.index, key); },
  toggle: togglePlay,
  next: () => next(),
  prev,
  shuffle: toggleShuffle,
  repeat: cycleRepeat,
  mute: toggleMute,
  like: el => el.dataset.id && toggleLike(el.dataset.id),
  more: el => { const r = el.getBoundingClientRect(); openMenu(r.right - 250, r.bottom + 4, trackMenu(el.dataset.id, el.dataset.list)); },
  'q-next': el => playNext(el.dataset.id),
  'add-to': el => addToPlaylist(el.dataset.pl, [el.dataset.id]),
  'new-pl-with': el => createPlaylist([el.dataset.id]),
  'remove-from': el => removeFromPlaylist(el.dataset.pl, el.dataset.id),
  'delete-track': el => deleteTrack(el.dataset.id),
  upload: el => { state.uploadTarget = el.dataset.target || null; $('#file-input').click(); },
  'add-url': el => addUrl(el.dataset.target),
  'new-playlist': () => createPlaylist(),
  'rename-pl': el => renamePlaylist(el.dataset.pl),
  'delete-pl': el => deletePlaylist(el.dataset.pl),
  'open-now': () => current() && toggleNow(true),
  'close-now': () => toggleNow(false),
  cloud: () => openCloudPanel(),
  drive: () => openDrivePanel(),
  'drive-refresh': () => drive.refresh(true),
  'download-list': el => downloadTracks(listTracks(el.dataset.list).map(t => t.id)),
  'undownload-list': el => {
    if (confirm('¿Quitar las descargas de esta lista? Seguirán en la nube.')) removeDownloads(listTracks(el.dataset.list).map(t => t.id));
  },
  'download-track': el => downloadTracks([el.dataset.id]),
  'undownload-track': el => removeDownloads([el.dataset.id]),
};
document.addEventListener('click', e => {
  const inMenu = e.target.closest('#menu');
  const el = e.target.closest('[data-act]');
  if (!inMenu) closeMenu();
  if (!el) return;
  actions[el.dataset.act]?.(el, e);
  if (inMenu) closeMenu();
});
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-row]');
  if (!row) return;
  e.preventDefault();
  openMenu(e.clientX, e.clientY, trackMenu(row.dataset.row, row.dataset.list));
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') { closeMenu(); toggleNow(false); }
  else if (e.key === 'ArrowRight' && e.altKey) next();
  else if (e.key === 'ArrowLeft' && e.altKey) prev();
  else if (e.key === 'ArrowRight' && current()) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === 'ArrowLeft' && current()) audio.currentTime = Math.max(0, audio.currentTime - 5);
});
$('#main').addEventListener('scroll', closeMenu);

$$('[data-bind=seek]').forEach(el => {
  el.addEventListener('input', () => {
    seeking = true;
    const d = isFinite(audio.duration) ? audio.duration : 0;
    el.style.setProperty('--p', el.value / 10 + '%');
    $$('[data-bind=time]').forEach(x => x.textContent = fmt(d * el.value / 1000));
  });
  el.addEventListener('change', () => {
    seeking = false;
    if (current() && isFinite(audio.duration)) audio.currentTime = audio.duration * el.value / 1000;
    updateTime();
  });
});
$$('[data-bind=volume]').forEach(el => el.addEventListener('input', () => {
  const v = el.value / 100;
  audio.volume = v; audio.muted = v === 0;
  if (v > 0) lastVolume = v;
  ls.set('sonora-volume', v);
  updateVolumeUI();
}));

$('#file-input').addEventListener('change', e => {
  handleFiles(e.target.files, state.uploadTarget);
  e.target.value = ''; state.uploadTarget = null;
});
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.replace('hidden', 'grid'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.replace('grid', 'hidden'); } });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.replace('grid', 'hidden');
  const target = state.view.name === 'playlist' && state.view.key?.startsWith('pl:') ? state.view.key : null;
  handleFiles(e.dataTransfer.files, target);
});

/* ---------- Ejemplos e inicio ---------- */
const SAMPLES = [
  ['Amanecer eléctrico', 1], ['Ruta nocturna', 2], ['Ciudad de cristal', 3], ['Olas de neón', 4],
  ['Viento del sur', 5], ['Paralelo 8', 8], ['Marea lenta', 10], ['Último tren', 12],
].map(([title, n], i) => ({
  title, artist: 'SoundHelix', album: i < 4 ? 'Ejemplos, vol. 1' : 'Ejemplos, vol. 2',
  src: `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${n}.mp3`
}));
async function seed() {
  const base = Date.now(); const ids = [];
  for (const [i, s] of SAMPLES.entries()) {
    const rec = hydrate({ id: uid(), kind: 'url', ...s, coverBlob: null, liked: i === 0 || i === 3, addedAt: base + i, duration: NaN });
    state.tracks.set(rec.id, rec); ids.push(rec.id);
    await saveTrack(rec).catch(() => {});
  }
  const pls = [
    { id: uid(), name: 'Canciones de ejemplo', trackIds: ids.slice(), createdAt: base },
    { id: uid(), name: 'Para concentrarse', trackIds: [ids[2], ids[5], ids[6]], createdAt: base + 1 },
    { id: uid(), name: 'Mix de la tarde', trackIds: [ids[1], ids[3], ids[7], ids[0]], createdAt: base + 2 },
  ];
  state.playlists.push(...pls);
  for (const p of pls) await savePl(p);
  ls.set('sonora-seeded', true);
}
async function probeMissingDurations() {
  for (const t of [...state.tracks.values()]) {
    if (isFinite(t.duration) || !state.tracks.has(t.id) || !t.url) continue; // Drive: se mide al reproducirla
    const d = await probeDuration(t.url);
    if (!isFinite(d)) continue;
    t.duration = d; saveTrack(t).catch(() => {});
    $$(`[data-dur="${t.id}"]`).forEach(el => el.textContent = fmt(d));
  }
  if (state.view.name === 'playlist') renderMain();
}

function updateCloudUI() {
  $$('[data-bind=cloud-pill]').forEach(el => {
    el.title = !cloud.active ? 'Conectar a la nube' : cloud.offline ? 'Sin conexión: solo música descargada' : `En la nube: ${cloud.user.email}`;
    el.classList.toggle('text-accent', cloud.active && !cloud.offline);
    el.classList.toggle('text-amber-400', cloud.active && cloud.offline);
    el.classList.toggle('text-zinc-400', !cloud.active);
  });
}

// Carga la biblioteca de la nube si hay sesión; si no, la de este dispositivo.
async function loadLibrary() {
  audio.pause(); audio.removeAttribute('src'); audio.load();
  for (const t of state.tracks.values()) {
    if (t.url?.startsWith('blob:')) URL.revokeObjectURL(t.url);
    if (t.coverUrl?.startsWith('blob:')) URL.revokeObjectURL(t.coverUrl);
  }
  Object.assign(state, { tracks: new Map(), playlists: [], queue: [], origQueue: [], qi: -1, source: null });
  if (cloud.active) {
    try {
      const { tracks, playlists } = await cloud.load();
      tracks.forEach(t => state.tracks.set(t.id, t));
      state.playlists = playlists;
      if (cloud.offline) toast(tracks.length ? 'Sin conexión: mostrando tu música descargada' : 'Sin conexión y sin canciones descargadas');
    } catch (e) { console.warn(e); toast('No se pudo cargar tu música de la nube. ¿Hay conexión?'); }
  } else {
    const [tracks, pls] = await Promise.all([DB.all('tracks').catch(() => []), DB.all('playlists').catch(() => [])]);
    tracks.forEach(r => state.tracks.set(r.id, hydrate(r)));
    state.playlists = pls.sort((a, b) => a.createdAt - b.createdAt);
    if (!ls.get('sonora-seeded', false) && !tracks.length && !pls.length && !drive.enabled) await seed();
  }
  await drive.merge().catch(e => console.warn(e));
  updateNowPlaying(); updatePlayIcons(); updateCloudUI();
  navigate(state.view.name === 'playlist' ? 'home' : state.view.name, undefined, false);
  probeMissingDurations();
  // Con la sesión de Google aún vigente, busca canciones nuevas en Drive sin preguntar.
  if (drive.enabled && drive.connected && navigator.onLine) drive.refresh(false);
}

(async function init() {
  history.replaceState({ app: 'sonora', guard: true }, '');
  paintIcons();
  updatePlayIcons(); updateModes(); updateVolumeUI(); updateNowPlaying();
  try { await DB.open(); } catch (e) { console.warn(e); toast('Sin almacenamiento: tu música no se guardará al cerrar'); }
  if (cloud.init()) await cloud.restore().catch(e => console.warn(e));
  drive.restore();
  await loadLibrary();
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

// Al volver la conexión, sincroniza con la nube (sin cortar lo que esté sonando).
window.addEventListener('online', async () => {
  if (!cloud.client || !cloud.offline) {
    // Solo Drive: vuelve a mostrar las canciones que no estaban descargadas.
    if (drive.enabled && audio.paused) { await drive.remerge(); if (drive.connected) drive.refresh(false); }
    return;
  }
  if (!audio.paused) return toast('Conexión recuperada: recarga para ver toda tu música');
  await cloud.restore().catch(() => {});
  await loadLibrary();
  toast('Conexión recuperada');
});
</script>
